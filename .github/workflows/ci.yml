name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check publication boundary and configuration
        run: make check

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')

      - name: Check Python syntax
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.py')
          if (( ${#files[@]} )); then
            python -m py_compile "${files[@]}"
          fi

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')

      - name: Verify research entry points
        run: |
          test -f README.md
          test -f CITATION.cff
          test -f LICENSE

  chaincode-unit:
    name: Chaincode unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chaincode/crimerecords
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chaincode/crimerecords/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests and coverage thresholds
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend-unit:
    name: Backend offline unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            chaincode/crimerecords/package-lock.json
            backend/package-lock.json
      # Several backend tests load the chaincode's policy and decision modules.
      - name: Install locked backend and chaincode dependencies
        run: |
          npm ci
          npm ci --prefix ../chaincode/crimerecords
      - name: Run offline tests
        run: npm run test:unit
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  dias-offline-suites:
    name: Policy, frontend and dataset tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            chaincode/crimerecords/package-lock.json
            backend/package-lock.json
      # The frontend navigation test reads the chaincode's role tables, and the
      # dataset tests use the backend prompt and policy context modules.
      - name: Install locked chaincode and backend dependencies
        run: |
          npm ci --prefix chaincode/crimerecords
          npm ci --prefix backend
      - name: Policy package tests
        run: npm test --prefix policies
      - name: Frontend tests and module syntax
        working-directory: frontend
        run: |
          npm test
          npm run check
      - name: Dataset and evaluation tests
        run: npm test --prefix experiments/dias-finetuning/v2

  caliper-validation:
    name: Caliper configuration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmarks/caliper
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: benchmarks/caliper/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # The plot-axes test draws a figure, so it needs matplotlib.
      - name: Install the plotting libraries
        run: python -m pip install matplotlib==3.10.9 pyyaml==6.0.2
      - name: Use the pinned npm controller
        run: npm install --global npm@11.5.1
      - name: Install locked dependencies
        run: npm ci --omit=dev
      - name: Validate configuration, scripts, and plot axes
        run: npm run check
      - name: Report advisories and reject critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
