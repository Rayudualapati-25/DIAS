<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="600" height="620">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#355c8a"/>
    </marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,4 L8,8 z" fill="#355c8a"/>
    </marker>
    <style>
      .title { font: bold 17px "Times New Roman", Times, serif; fill: #111; }
      .head { font: bold 15px "Times New Roman", Times, serif; fill: #111; }
      .body { font: 14px "Times New Roman", Times, serif; fill: #111; }
      .small { font: 12.5px "Times New Roman", Times, serif; fill: #222; }
      .tiny { font: 11.5px "Times New Roman", Times, serif; fill: #333; }
      .icon { fill: none; stroke: #333; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .exchange { fill: none; stroke: #355c8a; stroke-width: 2; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .spoke { fill: none; stroke: #355c8a; stroke-width: 2; }
      .link { fill: none; stroke: #555; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="600" height="720" fill="#fff"/>

  <!-- Organisation 1 -->
  <rect x="205" y="20" width="190" height="115" rx="5" fill="#fbfbfb" stroke="#222" stroke-width="1.5"/>
  <rect x="205" y="20" width="190" height="29" fill="#e7eef7" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="40" text-anchor="middle" class="title">Organisation 1</text>
  <g class="icon" aria-label="user icon">
    <circle cx="224" cy="65" r="4"/>
    <path d="M216 83 C216 74 232 74 232 83"/>
  </g>
  <text x="277" y="76" text-anchor="middle" class="body">Users / Entity</text>
  <g class="icon" aria-label="information system icon">
    <rect x="216" y="91" width="18" height="10" rx="1"/>
    <rect x="216" y="105" width="18" height="10" rx="1"/>
    <circle cx="220" cy="96" r="1" fill="#333" stroke="none"/>
    <circle cx="220" cy="110" r="1" fill="#333" stroke="none"/>
  </g>
  <text x="300" y="108" text-anchor="middle" class="body">Information System</text>
  <circle cx="300" cy="135" r="10" fill="#e7eef7" stroke="#222" stroke-width="1.4"/>
  <text x="300" y="139" text-anchor="middle" class="tiny">P</text>

  <!-- Organisation 2 -->
  <rect x="15" y="265" width="145" height="135" rx="5" fill="#fbfbfb" stroke="#222" stroke-width="1.5"/>
  <rect x="15" y="265" width="145" height="29" fill="#edf3fa" stroke="#222" stroke-width="1.5"/>
  <text x="87.5" y="285" text-anchor="middle" class="title">Organisation 2</text>
  <g class="icon" aria-label="user icon">
    <circle cx="39" cy="313" r="4"/>
    <path d="M31 331 C31 322 47 322 47 331"/>
  </g>
  <text x="103" y="324" text-anchor="middle" class="body">Users / Entity</text>
  <g class="icon" aria-label="information system icon">
    <rect x="30" y="345" width="18" height="10" rx="1"/>
    <rect x="30" y="359" width="18" height="10" rx="1"/>
    <circle cx="34" cy="350" r="1" fill="#333" stroke="none"/>
    <circle cx="34" cy="364" r="1" fill="#333" stroke="none"/>
  </g>
  <text x="105" y="351" text-anchor="middle" class="small">Information</text>
  <text x="105" y="367" text-anchor="middle" class="small">System</text>
  <circle cx="160" cy="333" r="10" fill="#edf3fa" stroke="#222" stroke-width="1.4"/>
  <text x="160" y="337" text-anchor="middle" class="tiny">P</text>

  <!-- Organisation N -->
  <rect x="440" y="265" width="145" height="135" rx="5" fill="#fbfbfb" stroke="#222" stroke-width="1.5"/>
  <rect x="440" y="265" width="145" height="29" fill="#edf5ec" stroke="#222" stroke-width="1.5"/>
  <text x="512.5" y="285" text-anchor="middle" class="title">Organisation N</text>
  <g class="icon" aria-label="user icon">
    <circle cx="459" cy="313" r="4"/>
    <path d="M451 331 C451 322 467 322 467 331"/>
  </g>
  <text x="523" y="324" text-anchor="middle" class="body">Users / Entity</text>
  <g class="icon" aria-label="information system icon">
    <rect x="450" y="345" width="18" height="10" rx="1"/>
    <rect x="450" y="359" width="18" height="10" rx="1"/>
    <circle cx="454" cy="350" r="1" fill="#333" stroke="none"/>
    <circle cx="454" cy="364" r="1" fill="#333" stroke="none"/>
  </g>
  <text x="525" y="351" text-anchor="middle" class="small">Information</text>
  <text x="525" y="367" text-anchor="middle" class="small">System</text>
  <circle cx="440" cy="333" r="10" fill="#edf5ec" stroke="#222" stroke-width="1.4"/>
  <text x="440" y="337" text-anchor="middle" class="tiny">P</text>

  <!-- Hub-and-spoke network -->
  <circle cx="300" cy="333" r="110" fill="#fafafa" stroke="#222" stroke-width="1.8"/>
  <text x="300" y="258" text-anchor="middle" class="title">Permissioned Blockchain</text>
  <text x="300" y="278" text-anchor="middle" class="title">Network</text>

  <g class="icon" aria-label="connected peers">
    <path d="M245 320 L300 302 L355 320 M245 320 L270 343 M300 312 L300 334 M355 320 L330 343"/>
    <circle cx="245" cy="320" r="10" fill="#eef3f9"/>
    <circle cx="300" cy="302" r="10" fill="#eef3f9"/>
    <circle cx="355" cy="320" r="10" fill="#eef3f9"/>
  </g>
  <text x="245" y="324" text-anchor="middle" class="tiny">P</text>
  <text x="300" y="306" text-anchor="middle" class="tiny">P</text>
  <text x="355" y="324" text-anchor="middle" class="tiny">P</text>

  <g class="icon" aria-label="shared ledger icon">
    <ellipse cx="300" cy="343" rx="30" ry="9" fill="#fff"/>
    <path d="M270 343 V376 C270 388 330 388 330 376 V343" fill="#fff"/>
    <path d="M270 359 C270 371 330 371 330 359"/>
    <path d="M270 375 C270 387 330 387 330 375"/>
  </g>
  <text x="300" y="405" text-anchor="middle" class="small">Shared Ledger</text>
  <text x="300" y="427" text-anchor="middle" class="tiny">P = organisation peer</text>

  <!-- Bidirectional organisation connections -->
  <path d="M300 148 L300 213" class="exchange"/>
  <text x="313" y="184" class="tiny">request / result</text>
  <path d="M170 333 L188 333" class="spoke"/>
  <path d="M412 333 L430 333" class="spoke"/>

  <!-- AI organisation: a network peer and an off-chain model service -->
  <path d="M300 448 L300 478 L205 478 L205 540" class="exchange"/>
  <text x="315" y="475" class="tiny">context / signed decision</text>
  <rect x="150" y="500" width="300" height="105" rx="5" fill="#fbfbfb" stroke="#777" stroke-width="1.4"/>
  <rect x="150" y="500" width="300" height="28" fill="#fff3d6" stroke="#777" stroke-width="1.4"/>
  <text x="300" y="520" text-anchor="middle" class="title">AI Organisation</text>
  <circle cx="205" cy="558" r="14" fill="#fff3d6" stroke="#222" stroke-width="1.4"/>
  <text x="205" y="562" text-anchor="middle" class="tiny">P</text>
  <text x="205" y="586" text-anchor="middle" class="small">AI Peer</text>
  <path d="M222 558 L251 558" class="spoke"/>
  <rect x="255" y="535" width="170" height="50" rx="4" fill="#fff8eb" stroke="#777" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="330" y="555" text-anchor="middle" class="head">Off-chain LLM</text>
  <text x="330" y="575" text-anchor="middle" class="body">Decision Service</text>
  <polygon points="405,543 416,549 416,561 405,567 394,561 394,549" fill="#fff8eb" stroke="#333" stroke-width="1.3"/>
  <text x="405" y="559" text-anchor="middle" style="font: bold 10px Arial, Helvetica, sans-serif; fill: #333;">AI</text>

</svg>
