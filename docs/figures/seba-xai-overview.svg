<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" font-family="Times New Roman, Georgia, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1300" height="760" fill="#fff"/>

  <rect x="40" y="40" width="1220" height="270" fill="none" stroke="#666" stroke-dasharray="8 6"/>
  <text x="52" y="60" font-size="12" font-style="italic" fill="#666">OFF-CHAIN</text>
  <rect x="40" y="360" width="1220" height="360" fill="#F7F7F7" stroke="#333"/>
  <text x="52" y="380" font-size="12" font-weight="bold">ON-CHAIN — Permissioned blockchain (Hyperledger Fabric), channel: crimechannel</text>

  <rect x="70" y="80" width="200" height="150" fill="#fff" stroke="#000"/>
  <text x="170" y="102" font-size="13" font-weight="bold" text-anchor="middle">Requesting Officer</text>
  <text x="170" y="124" font-size="10.5" text-anchor="middle">Police / Forensics /</text>
  <text x="170" y="139" font-size="10.5" text-anchor="middle">Prosecution / Court</text>
  <text x="170" y="166" font-size="10.5" text-anchor="middle">X.509 identity carries</text>
  <text x="170" y="181" font-size="10.5" text-anchor="middle">role · station · jurisdiction</text>
  <text x="170" y="196" font-size="10.5" text-anchor="middle">· clearance</text>
  <rect x="60" y="242" width="220" height="44" rx="6" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="170" y="261" font-size="9.5" font-style="italic" text-anchor="middle">“I need to view the metadata for</text>
  <text x="170" y="275" font-size="9.5" font-style="italic" text-anchor="middle">REC-FIR-001 for investigation.”</text>

  <rect x="700" y="70" width="530" height="220" fill="#fff" stroke="#000"/>
  <text x="965" y="90" font-size="13" font-weight="bold" text-anchor="middle">AI Organisation (AIOrgMSP) — identity: llm-decider</text>
  <rect x="722" y="112" width="230" height="80" fill="#EEE" stroke="#000"/>
  <text x="837" y="134" font-size="12" font-weight="bold" text-anchor="middle">Fine-tuned Qwen3-14B</text>
  <text x="837" y="152" font-size="10" text-anchor="middle">LoRA adapter, 4-bit</text>
  <text x="837" y="167" font-size="10" text-anchor="middle">ALLOW / DENY / ESCALATE</text>
  <text x="837" y="182" font-size="10" text-anchor="middle">+ reason code</text>
  <rect x="978" y="112" width="230" height="80" fill="#EEE" stroke="#000"/>
  <text x="1093" y="134" font-size="12" font-weight="bold" text-anchor="middle">Deterministic policy engine</text>
  <text x="1093" y="155" font-size="10" text-anchor="middle">safety guard — disagreement</text>
  <text x="1093" y="170" font-size="10" text-anchor="middle">forces human review</text>
  <line x1="952" y1="152" x2="974" y2="152" stroke="#000" marker-end="url(#a)"/>
  <rect x="722" y="214" width="486" height="46" fill="#fff" stroke="#000"/>
  <text x="965" y="234" font-size="10.5" text-anchor="middle">Ed25519 attestation over</text>
  <text x="965" y="250" font-size="10.5" text-anchor="middle">{ hash(query), hash(attributes), decision }</text>

  <rect x="70" y="392" width="1160" height="86" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="650" y="410" font-size="10.5" font-style="italic" fill="#444" text-anchor="middle">Endorsing peers — a decision commits only when a majority of organisations independently verify it</text>
  <rect x="90" y="424" width="160" height="40" fill="#fff" stroke="#000"/><text x="170" y="449" font-size="10.5" text-anchor="middle">Police</text>
  <rect x="266" y="424" width="160" height="40" fill="#fff" stroke="#000"/><text x="346" y="449" font-size="10.5" text-anchor="middle">Forensics</text>
  <rect x="442" y="424" width="160" height="40" fill="#fff" stroke="#000"/><text x="522" y="449" font-size="10.5" text-anchor="middle">Prosecution</text>
  <rect x="618" y="424" width="160" height="40" fill="#fff" stroke="#000"/><text x="698" y="449" font-size="10.5" text-anchor="middle">Court</text>
  <rect x="794" y="424" width="160" height="40" fill="#fff" stroke="#000"/><text x="874" y="443" font-size="10.5" text-anchor="middle">Authority</text><text x="874" y="457" font-size="9" text-anchor="middle">(department heads)</text>
  <rect x="970" y="424" width="160" height="40" fill="#DDD" stroke="#000" stroke-width="2"/><text x="1050" y="449" font-size="10.5" font-weight="bold" text-anchor="middle">AI Organisation</text>

  <rect x="90" y="520" width="250" height="120" fill="#fff" stroke="#000"/>
  <text x="215" y="542" font-size="11.5" font-weight="bold" text-anchor="middle">TX A — Access Request</text>
  <text x="215" y="559" font-size="9.5" text-anchor="middle">signed by the OFFICER</text>
  <text x="215" y="583" font-size="9.5" text-anchor="middle">trusted attribute snapshot</text>
  <text x="215" y="599" font-size="9.5" text-anchor="middle">hash(query)</text>
  <text x="215" y="615" font-size="9.5" text-anchor="middle">status: REQUESTED</text>

  <rect x="500" y="520" width="300" height="120" fill="#EEE" stroke="#000" stroke-width="2"/>
  <text x="650" y="542" font-size="11.5" font-weight="bold" text-anchor="middle">TX B — Access Decision</text>
  <text x="650" y="559" font-size="9.5" font-weight="bold" text-anchor="middle">signed by the AI ORGANISATION</text>
  <text x="650" y="581" font-size="9.5" text-anchor="middle">decision · reason code · counterfactual</text>
  <text x="650" y="596" font-size="9.5" text-anchor="middle">decisive attributes (XAI artifact, hashed)</text>
  <text x="650" y="611" font-size="9.5" text-anchor="middle">attestation ↔ registered adapter digest</text>
  <text x="650" y="628" font-size="9.5" font-style="italic" text-anchor="middle">subject = the officer, not the AI</text>

  <rect x="960" y="520" width="250" height="120" fill="#fff" stroke="#000"/>
  <text x="1085" y="542" font-size="11.5" font-weight="bold" text-anchor="middle">TX C — Metadata Release</text>
  <text x="1085" y="559" font-size="9.5" text-anchor="middle">signed by the OFFICER</text>
  <text x="1085" y="585" font-size="9.5" text-anchor="middle">released only to the identity</text>
  <text x="1085" y="601" font-size="9.5" text-anchor="middle">named in decision B</text>

  <rect x="90" y="660" width="710" height="40" rx="6" fill="#fff" stroke="#666" stroke-dasharray="4 3"/>
  <text x="445" y="676" font-size="9.5" text-anchor="middle">Private data collection <tspan font-style="italic">accessRequestQuery</tspan> — the question in full;</text>
  <text x="445" y="690" font-size="9.5" text-anchor="middle">the public ledger holds only its hash</text>
  <text x="1210" y="676" font-size="10" font-style="italic" fill="#444" text-anchor="end">Immutable transaction log —</text>
  <text x="1210" y="690" font-size="10" font-style="italic" fill="#444" text-anchor="end">who asked, who decided, who read</text>

  <line x1="170" y1="286" x2="170" y2="516" stroke="#000" marker-end="url(#a)"/>
  <text x="178" y="330" font-size="11" font-weight="bold">1</text><text x="190" y="330" font-size="10.5">submit request</text>

  <path d="M340 545 L400 545 L400 500 L1050 500 L1050 468" fill="none" stroke="#000" marker-end="url(#a)"/>
  <text x="700" y="494" font-size="11" font-weight="bold" text-anchor="middle">2</text>
  <text x="716" y="494" font-size="10.5">AccessRequestCreated event</text>

  <path d="M1130 444 L1244 444 L1244 296" fill="none" stroke="#000" marker-end="url(#a)"/>
  <text x="1234" y="352" font-size="11" font-weight="bold" text-anchor="end">3</text>
  <text x="1226" y="352" font-size="10.5" text-anchor="end">read attributes and</text>
  <text x="1226" y="366" font-size="10.5" text-anchor="end">question from the ledger</text>

  <line x1="1093" y1="196" x2="1093" y2="210" stroke="#000" marker-end="url(#a)"/>
  <text x="1104" y="208" font-size="11" font-weight="bold">4</text>
  <text x="1116" y="208" font-size="10.5">decide off-chain, then sign</text>

  <path d="M722 237 L650 237 L650 516" fill="none" stroke="#000" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="330" font-size="11" font-weight="bold" text-anchor="end">5</text>
  <text x="572" y="330" font-size="10.5">submit signed decision</text>
  <text x="572" y="345" font-size="10.5">— peers verify the attestation and</text>
  <text x="572" y="360" font-size="10.5">that the facts have not changed</text>

  <line x1="800" y1="580" x2="956" y2="580" stroke="#000" marker-end="url(#a)"/>
  <text x="878" y="572" font-size="11" font-weight="bold" text-anchor="middle">6</text>
  <text x="878" y="600" font-size="10.5" text-anchor="middle">ALLOW → gated metadata</text>

  <path d="M800 545 L874 545 L874 468" fill="none" stroke="#000" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="884" y="500" font-size="10.5">6a  DENY → request review</text>
  <text x="884" y="514" font-size="10.5">6b  ESCALATE → human decides</text>

  <path d="M170 288 L60 288 L60 680 L86 680" fill="none" stroke="#555" stroke-dasharray="4 3" marker-end="url(#ag)"/>
</svg>
