  workers:
    number: 8
  rounds:
    - label: search-users-8
      txDuration: 5
      rateControl:
        type: fixed-rate
        opts:
          tps: 8
      workload:
        module: workloads/read-record.js
        arguments:
          contractId: crimerecords
          recordId: REC-FIR-001
          invokerIdentity: io.krishnan
          invokerMspId: PoliceMSP
monitors:
  transaction:
    - module: monitors/latency-tx-observer.js
      options: {}
