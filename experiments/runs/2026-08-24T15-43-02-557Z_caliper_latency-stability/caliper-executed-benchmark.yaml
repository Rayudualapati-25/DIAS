test:
  name: SEBA-XAI short stability latency pilot
  description: Measure average latency over ten consecutive 30-second bins.
  workers:
    number: 1
  rounds:
    - label: stability-warmup
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workloads/request-access-verified.js
        arguments: &ref_0
          contractId: crimerecords
          recordId: REC-FIR-001
          action: view
          purpose: investigation
          expectedReasonCode: POLICY_SATISFIED
          invokerIdentity: io.krishnan
          invokerMspId: PoliceMSP
    - label: stability-bin-01
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workloads/request-access-verified.js
        arguments: *ref_0
