test:
  name: SEBA-XAI access-write latency by offered TPS
  description: >-
    Measure verified contextual access-write latency at five offered-load
    points.
  workers:
    number: 4
  rounds:
    - label: write-tps-warmup
      txDuration: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workloads/request-access-verified.js
        arguments: &ref_0
          contractId: crimerecords
          recordId: REC-FIR-001
          action: view
          purpose: investigation
          expectedReasonCode: POLICY_SATISFIED
          invokerIdentity: io.krishnan
          invokerMspId: PoliceMSP
    - label: write-tps-1
      txDuration: 45
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workloads/request-access-verified.js
        arguments: *ref_0
    - label: write-tps-2
      txDuration: 45
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: workloads/request-access-verified.js
        arguments: *ref_0
    - label: write-tps-5
      txDuration: 45
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: workloads/request-access-verified.js
        arguments: *ref_0
    - label: write-tps-10
      txDuration: 45
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/request-access-verified.js
        arguments: *ref_0
    - label: write-tps-20
      txDuration: 45
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/request-access-verified.js
        arguments: *ref_0
monitors:
  transaction:
    - module: ./monitors/latency-tx-observer.js
  resource:
    - module: prometheus
      options:
        url: http://127.0.0.1:9090
        metrics:
          include:
            - .*
          queries:
            - name: Process resident memory (MiB, max)
              query: process_resident_memory_bytes{job=~"fabric-.*"}
              step: 1
              label: instance
              statistic: max
              multiplier: 9.5367431640625e-7
            - name: Process CPU rate (percent, max)
              query: rate(process_cpu_seconds_total{job=~"fabric-.*"}[1m])
              step: 1
              label: instance
              statistic: max
              multiplier: 100
            - name: Crimerecords endorsement duration (seconds, avg)
              query: >-
                sum by (instance)
                (rate(endorser_proposal_duration_sum{job=~"fabric-.*",channel="crimechannel",chaincode="crimerecords",success="true"}[1m]))
                / sum by (instance)
                (rate(endorser_proposal_duration_count{job=~"fabric-.*",channel="crimechannel",chaincode="crimerecords",success="true"}[1m]))
              step: 1
              label: instance
              statistic: avg
            - name: Ledger height (blocks, max)
              query: >-
                ledger_blockchain_height{job=~"fabric-.*",channel="crimechannel"}
              step: 1
              label: instance
              statistic: max
