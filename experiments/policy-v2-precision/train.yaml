model: mlx-community/Qwen3-14B-4bit
train: true
fine_tune_type: lora
optimizer: adam
data: ../experiments/policy-v2-precision/data
seed: 42
num_layers: 16
batch_size: 1
iters: 300
val_batches: 20
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 150
grad_accumulation_steps: 4
adapter_path: experiments/llm_policy_engine/adapters/qwen3-14b-seba-lora-v6
resume_adapter_file: experiments/llm_policy_engine/adapters/qwen3-14b-seba-lora-v4-best/adapters.safetensors
save_every: 150
max_seq_length: 1536
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0
