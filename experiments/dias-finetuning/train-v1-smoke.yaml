# Smoke check for train-v1.yaml: same model, data, and hyperparameters, shortened
# to verify paths, memory, throughput, and a finite loss before the full run.
model: mlx-community/Qwen3-14B-4bit
train: true
fine_tune_type: lora
optimizer: adam
data: ../experiments/dias-finetuning/data-v1
seed: 42
num_layers: 16
batch_size: 1
iters: 30
val_batches: 10
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 30
grad_accumulation_steps: 4
adapter_path: experiments/llm_policy_engine/adapters/qwen3-14b-dias-lora-v1-smoke
save_every: 30
max_seq_length: 1536
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0
