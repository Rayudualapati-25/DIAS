# V7 smoke test: fresh Qwen3-14B base, production-length DIAS v2 prompts.
# This is intentionally short. It verifies loading, finite loss, memory use,
# throughput, checkpoint creation, and that no previous SEAL adapter is resumed.
model: mlx-community/Qwen3-14B-4bit
train: true
fine_tune_type: lora
optimizer: adam
data: ../experiments/dias-finetuning/data-v2-binary
seed: 42
num_layers: 16
batch_size: 1
iters: 12
val_batches: 2
learning_rate: 1e-5
steps_per_report: 4
steps_per_eval: 12
grad_accumulation_steps: 4
adapter_path: experiments/llm_policy_engine/adapters/qwen3-14b-dias-lora-v7-smoke
save_every: 12
max_seq_length: 2560
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0
