# ON HOLD (2026-09-11): do not run until the architecture, policy, and dataset review is complete.
# DIAS recommender LoRA v1 (plan: experiments/plans/20260911_dias_qwen3_lora_training.md).
# Paths are relative to LLMxAI/, where run_training.py runs mlx-lm.
# Hyperparameters match the retained V4-V6 runs. MLX-LM counts iters in
# micro-batches: 3000 x batch 1 = one epoch of train.jsonl (750 optimizer updates).
# The longest example is 1152 tokens, so max_seq_length 1536 truncates nothing.
model: mlx-community/Qwen3-14B-4bit
train: true
fine_tune_type: lora
optimizer: adam
data: ../experiments/dias-finetuning/data-v1
seed: 42
num_layers: 16
batch_size: 1
iters: 3000
val_batches: 100
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 300
grad_accumulation_steps: 4
adapter_path: experiments/llm_policy_engine/adapters/qwen3-14b-dias-lora-v1
save_every: 600
max_seq_length: 1536
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 20.0
