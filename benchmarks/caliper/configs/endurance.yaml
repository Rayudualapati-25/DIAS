test:
  name: SEBA-XAI endurance performance
  description: >-
    Sustain the deterministic staggered 70/30 read/write schedule for two hours
    at moderate load. Every complete ten-operation cycle per worker is seven
    reads and three writes. The warm-up round is excluded from measurements.
  workers:
    number: 4
  rounds:
    - label: endurance-warmup-2-tps
      description: Warm read and write paths before the endurance measurement.
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: workloads/mixed-record-access.js
        arguments: &mixed_arguments
          contractId: crimerecords
          recordId: REC-FIR-001
          action: view
          purpose: investigation
          invokerIdentity: io.krishnan
          invokerMspId: PoliceMSP
          readPercent: 70

    - label: endurance-70-read-30-write
      description: Measure sustained deterministic 70/30 traffic for two hours.
      txDuration: 7200
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: workloads/mixed-record-access.js
        arguments: *mixed_arguments

monitors:
  resource:
    - module: docker
      options:
        interval: 5
        cpuUsageNormalization: true
        containers:
          - all
        charting:
          bar:
            metrics:
              - Memory(max)
              - CPU%(max)

    - module: prometheus
      options:
        url: http://127.0.0.1:9090
        metrics:
          include:
            - ".*"
          queries:
            - name: Process resident memory (MiB, max)
              query: 'process_resident_memory_bytes{job=~"fabric-.*"}'
              step: 5
              label: instance
              statistic: max
              multiplier: 0.00000095367431640625
            - name: Process CPU rate (percent, max)
              query: 'rate(process_cpu_seconds_total{job=~"fabric-.*"}[1m])'
              step: 5
              label: instance
              statistic: max
              multiplier: 100
            - name: Crimerecords endorsement duration (seconds, avg)
              query: 'sum by (instance) (rate(endorser_proposal_duration_sum{job=~"fabric-.*",channel="crimechannel",chaincode="crimerecords",success="true"}[1m])) / sum by (instance) (rate(endorser_proposal_duration_count{job=~"fabric-.*",channel="crimechannel",chaincode="crimerecords",success="true"}[1m]))'
              step: 5
              label: instance
              statistic: avg
            - name: Ledger height (blocks, max)
              query: 'ledger_blockchain_height{job=~"fabric-.*",channel="crimechannel"}'
              step: 5
              label: instance
              statistic: max
