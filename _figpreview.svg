<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#355c8a"/>
    </marker>
    <style>
      .serif { font-family: "Times New Roman", Times, serif; fill: #111; }
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .layer { font: bold 15px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; fill: #333; }
      .orgtitle { font: bold 17px "Times New Roman", Times, serif; fill: #111; }
      .boxhead { font: bold 15px "Times New Roman", Times, serif; fill: #111; }
      .body { font: 14px "Times New Roman", Times, serif; fill: #111; }
      .small { font: 12.5px "Times New Roman", Times, serif; fill: #222; }
      .step { font: bold 15px Arial, Helvetica, sans-serif; fill: white; }
      .steplabel { font: 13px "Times New Roman", Times, serif; fill: #111; }
      .line { fill: none; stroke: #1d1d1d; stroke-width: 2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); }
      .dataline { fill: none; stroke: #355c8a; stroke-width: 3; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <!-- Participating organisations: local users and information systems -->
  <rect x="35" y="28" width="1105" height="278" rx="6" fill="#fbfbfb" stroke="#777" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="55" y="52" class="layer">PARTICIPATING ORGANISATIONS AND LOCAL INFORMATION SYSTEMS</text>

  <!-- Police -->
  <g>
    <rect x="55" y="70" width="250" height="208" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <rect x="55" y="70" width="250" height="38" fill="#e7eef7" stroke="#222" stroke-width="1.6"/>
    <text x="180" y="95" text-anchor="middle" class="orgtitle">Police Organisation</text>
    <circle cx="95" cy="145" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <path d="M72 190 C72 166,118 166,118 190" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="95" y="211" text-anchor="middle" class="small">Investigator</text>
    <rect x="145" y="126" width="140" height="72" rx="4" fill="#f4f7fb" stroke="#222" stroke-width="1.5"/>
    <text x="215" y="153" text-anchor="middle" class="boxhead">Police Record</text>
    <text x="215" y="173" text-anchor="middle" class="boxhead">System</text>
    <path d="M118 162 L141 162" class="thin"/>
    <ellipse cx="215" cy="226" rx="48" ry="10" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <rect x="167" y="226" width="96" height="24" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <path d="M167 250 C167 263,263 263,263 250" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <text x="215" y="245" text-anchor="middle" class="small">case records</text>
    <path d="M215 198 L215 214" class="thin"/>
  </g>

  <!-- Forensics -->
  <g>
    <rect x="320" y="70" width="250" height="208" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <rect x="320" y="70" width="250" height="38" fill="#e6f1e4" stroke="#222" stroke-width="1.6"/>
    <text x="445" y="95" text-anchor="middle" class="orgtitle">Forensics Organisation</text>
    <circle cx="360" cy="145" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <path d="M337 190 C337 166,383 166,383 190" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="360" y="211" text-anchor="middle" class="small">Examiner</text>
    <rect x="410" y="126" width="140" height="72" rx="4" fill="#f2f8f1" stroke="#222" stroke-width="1.5"/>
    <text x="480" y="153" text-anchor="middle" class="boxhead">Forensic Lab</text>
    <text x="480" y="173" text-anchor="middle" class="boxhead">System</text>
    <path d="M383 162 L406 162" class="thin"/>
    <ellipse cx="480" cy="226" rx="48" ry="10" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <rect x="432" y="226" width="96" height="24" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <path d="M432 250 C432 263,528 263,528 250" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <text x="480" y="245" text-anchor="middle" class="small">lab reports</text>
    <path d="M480 198 L480 214" class="thin"/>
  </g>

  <!-- Prosecution -->
  <g>
    <rect x="585" y="70" width="250" height="208" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <rect x="585" y="70" width="250" height="38" fill="#fff0d8" stroke="#222" stroke-width="1.6"/>
    <text x="710" y="95" text-anchor="middle" class="orgtitle">Prosecution Organisation</text>
    <circle cx="625" cy="145" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <path d="M602 190 C602 166,648 166,648 190" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="625" y="211" text-anchor="middle" class="small">Prosecutor</text>
    <rect x="675" y="126" width="140" height="72" rx="4" fill="#fff8eb" stroke="#222" stroke-width="1.5"/>
    <text x="745" y="153" text-anchor="middle" class="boxhead">Prosecution</text>
    <text x="745" y="173" text-anchor="middle" class="boxhead">Case System</text>
    <path d="M648 162 L671 162" class="thin"/>
    <ellipse cx="745" cy="226" rx="48" ry="10" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <rect x="697" y="226" width="96" height="24" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <path d="M697 250 C697 263,793 263,793 250" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <text x="745" y="245" text-anchor="middle" class="small">case files</text>
    <path d="M745 198 L745 214" class="thin"/>
  </g>

  <!-- Court -->
  <g>
    <rect x="850" y="70" width="250" height="208" fill="#fff" stroke="#222" stroke-width="1.6"/>
    <rect x="850" y="70" width="250" height="38" fill="#eee8f5" stroke="#222" stroke-width="1.6"/>
    <text x="975" y="95" text-anchor="middle" class="orgtitle">Court Organisation</text>
    <circle cx="890" cy="145" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <path d="M867 190 C867 166,913 166,913 190" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="890" y="211" text-anchor="middle" class="small">Judge / Clerk</text>
    <rect x="940" y="126" width="140" height="72" rx="4" fill="#f8f5fb" stroke="#222" stroke-width="1.5"/>
    <text x="1010" y="153" text-anchor="middle" class="boxhead">Court Case</text>
    <text x="1010" y="173" text-anchor="middle" class="boxhead">System</text>
    <path d="M913 162 L936 162" class="thin"/>
    <ellipse cx="1010" cy="226" rx="48" ry="10" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <rect x="962" y="226" width="96" height="24" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <path d="M962 250 C962 263,1058 263,1058 250" fill="#fff" stroke="#444" stroke-width="1.3"/>
    <text x="1010" y="245" text-anchor="middle" class="small">court records</text>
    <path d="M1010 198 L1010 214" class="thin"/>
  </g>

  <!-- Step 1 convergence from all local systems -->
  <path d="M215 278 L215 330 L575 330" class="thin"/>
  <path d="M480 278 L480 330 L575 330" class="thin"/>
  <path d="M745 278 L745 330 L575 330" class="thin"/>
  <path d="M1010 278 L1010 330 L575 330" class="thin"/>
  <circle cx="575" cy="330" r="15" fill="#222"/>
  <text x="575" y="335" text-anchor="middle" class="step">1</text>
  <text x="595" y="324" class="steplabel">User submits an access request through the organisation's information system</text>

  <!-- AI organisation -->
  <rect x="1175" y="28" width="390" height="350" rx="6" fill="#fbfbfb" stroke="#777" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1195" y="52" class="layer">AI ORGANISATION (AIOrgMSP)</text>
  <rect x="1200" y="76" width="340" height="64" rx="4" fill="#e7eef7" stroke="#222" stroke-width="1.6"/>
  <text x="1370" y="101" text-anchor="middle" class="boxhead">Ledger event and verified context</text>
  <text x="1370" y="122" text-anchor="middle" class="small">request + subject/resource attributes</text>
  <rect x="1200" y="165" width="155" height="92" rx="4" fill="#f2f8f1" stroke="#222" stroke-width="1.6"/>
  <text x="1278" y="192" text-anchor="middle" class="boxhead">Fine-tuned LLM</text>
  <text x="1278" y="214" text-anchor="middle" class="small">Qwen3-14B LoRA</text>
  <text x="1278" y="235" text-anchor="middle" class="small">interprets the request</text>
  <rect x="1385" y="165" width="155" height="92" rx="4" fill="#fff0d8" stroke="#222" stroke-width="1.6"/>
  <text x="1463" y="192" text-anchor="middle" class="boxhead">Policy guard</text>
  <text x="1463" y="214" text-anchor="middle" class="small">checks the decision</text>
  <text x="1463" y="235" text-anchor="middle" class="small">and reason code</text>
  <path d="M1355 211 L1381 211" class="line"/>
  <circle cx="1369" cy="153" r="15" fill="#222"/>
  <text x="1369" y="158" text-anchor="middle" class="step">3</text>
  <rect x="1200" y="282" width="340" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text x="1370" y="306" text-anchor="middle" class="boxhead">Signed decision and explanation</text>
  <text x="1370" y="328" text-anchor="middle" class="small">ALLOW / DENY / ESCALATE + reason + counterfactual</text>
  <path d="M1463 257 L1463 278" class="line"/>
  <circle cx="1518" cy="270" r="15" fill="#222"/>
  <text x="1518" y="275" text-anchor="middle" class="step">4</text>

  <!-- Shared permissioned blockchain -->
  <rect x="60" y="385" width="1080" height="330" rx="7" fill="#fafafa" stroke="#222" stroke-width="2"/>
  <rect x="60" y="385" width="1080" height="46" fill="#e9e9e9" stroke="#222" stroke-width="2"/>
  <text x="600" y="414" text-anchor="middle" class="orgtitle">Permissioned Blockchain Consortium - Hyperledger Fabric</text>
  <rect x="92" y="458" width="1016" height="74" rx="5" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="600" y="483" text-anchor="middle" class="boxhead">Access-control smart contract</text>
  <text x="600" y="506" text-anchor="middle" class="body">records the request, verifies trusted attributes and model attestation, and gates release</text>
  <circle cx="1070" cy="446" r="15" fill="#222"/>
  <text x="1070" y="451" text-anchor="middle" class="step">2</text>

  <text x="92" y="564" class="layer">ENDORSING PEERS</text>
  <g class="small">
    <rect x="92" y="580" width="145" height="48" fill="#e7eef7" stroke="#333" stroke-width="1.4"/>
    <text x="164" y="609" text-anchor="middle">Police peer</text>
    <rect x="253" y="580" width="145" height="48" fill="#e6f1e4" stroke="#333" stroke-width="1.4"/>
    <text x="325" y="609" text-anchor="middle">Forensics peer</text>
    <rect x="414" y="580" width="145" height="48" fill="#fff0d8" stroke="#333" stroke-width="1.4"/>
    <text x="486" y="609" text-anchor="middle">Prosecution peer</text>
    <rect x="575" y="580" width="145" height="48" fill="#eee8f5" stroke="#333" stroke-width="1.4"/>
    <text x="647" y="609" text-anchor="middle">Court peer</text>
    <rect x="736" y="580" width="145" height="48" fill="#f0f0f0" stroke="#333" stroke-width="1.4"/>
    <text x="808" y="609" text-anchor="middle">Authority peer</text>
    <rect x="897" y="580" width="178" height="48" fill="#dce8f5" stroke="#222" stroke-width="2.2"/>
    <text x="986" y="609" text-anchor="middle" font-weight="bold">AI organisation peer</text>
  </g>
  <rect x="145" y="652" width="910" height="40" rx="4" fill="#fff" stroke="#444" stroke-width="1.4"/>
  <text x="600" y="677" text-anchor="middle" class="body">Shared ledger: access request + signed decision + explanation hash + data-exchange receipt</text>
  <circle cx="1090" cy="649" r="15" fill="#222"/>
  <text x="1090" y="654" text-anchor="middle" class="step">5</text>

  <!-- Event to the AI organisation and signed result back -->
  <path d="M1108 481 L1150 481 L1150 109 L1196 109" class="line"/>
  <text x="1158" y="160" class="steplabel">event</text>
  <path d="M1200 316 L1160 316 L1160 553 L1108 553" class="line"/>
  <text x="1168" y="340" class="steplabel">signed result</text>

  <!-- Ledger-gated data exchange -->
  <rect x="60" y="753" width="1480" height="112" rx="7" fill="#f4f7fb" stroke="#355c8a" stroke-width="2"/>
  <text x="80" y="779" class="layer">LEDGER-GATED INTER-AGENCY DATA EXCHANGE</text>
  <rect x="115" y="795" width="300" height="48" rx="4" fill="#fff" stroke="#355c8a" stroke-width="1.8"/>
  <text x="265" y="815" text-anchor="middle" class="boxhead">Owning organisation</text>
  <text x="265" y="834" text-anchor="middle" class="small">information system and protected record</text>
  <path d="M415 819 L1123 819" class="dataline"/>
  <text x="770" y="807" text-anchor="middle" class="boxhead" fill="#355c8a">authorised record exchange</text>
  <text x="770" y="842" text-anchor="middle" class="small">ALLOW releases to the named requester; DENY blocks; ESCALATE routes to human review</text>
  <rect x="1128" y="795" width="330" height="48" rx="4" fill="#fff" stroke="#355c8a" stroke-width="1.8"/>
  <text x="1293" y="815" text-anchor="middle" class="boxhead">Requesting organisation</text>
  <text x="1293" y="834" text-anchor="middle" class="small">information system and authenticated user</text>
  <circle cx="1495" cy="780" r="15" fill="#355c8a"/>
  <text x="1495" y="785" text-anchor="middle" class="step">6</text>
  <path d="M600 715 L600 749" class="dataline"/>
</svg>
